name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Every canonical Python solution against its tests, with the same harness the browser uses.
      - run: npm run verify:content
      # Build before type-checking: `next build` generates the route types (PageProps) that tsc needs.
      - run: npm run build
      - run: npm run type-check
